name: EventFlow validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check server.js
          node --check zip.js
          node --check scripts/create-demo.js
          node --check public/app.js
          node --check public/extensions.js
          node --check public/v12.js
          node --check public/v13.js
          node --check public/v14.js
          node --check public/v15.js
      - name: API integration tests
        run: npm test
